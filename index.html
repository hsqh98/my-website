<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استمارة تسجيل المريض الراقد</title>
    <!-- استخدام خط عربي أنيق Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background-color: #f0f4f8;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 600px;
        }
        h2 {
            text-align: center;
            color: #1e3a8a;
            margin-bottom: 25px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group.full-width {
            grid-column: span 2;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #334155;
            font-size: 14px;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }
        button:hover {
            background-color: #1d4ed8;
        }
        button:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }
        .alert {
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-weight: 600;
            display: none;
        }
        .alert.success {
            background-color: #d1fae5;
            color: #065f46;
            display: block;
        }
        .alert.error {
            background-color: #fee2e2;
            color: #991b1b;
            display: block;
        }
        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .form-group.full-width {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>استمارة المريض الراقد</h2>
    <form id="patientForm">
        <div class="form-grid">
            <!-- اسم المريض -->
            <div class="form-group">
                <label for="patientName">اسم المريض:</label>
                <input type="text" id="patientName" name="patientName" required placeholder="الاسم الثلاثي واللقب">
            </div>

            <!-- اسم الأم -->
            <div class="form-group">
                <label for="motherName">اسم الأم:</label>
                <input type="text" id="motherName" name="motherName" required placeholder="اسم الأم الثلاثي">
            </div>

            <!-- الجنس -->
            <div class="form-group">
                <label for="gender">الجنس:</label>
                <select id="gender" name="gender" required>
                    <option value="">اختر الجنس</option>
                    <option value="ذكر">ذكر</option>
                    <option value="أنثى">أنثى</option>
                </select>
            </div>

            <!-- العمر -->
            <div class="form-group">
                <label for="age">العمر:</label>
                <input type="number" id="age" name="age" required min="0" max="120" placeholder="العمر بالسنة">
            </div>

            <!-- السكن -->
            <div class="form-group">
                <label for="address">السكن:</label>
                <input type="text" id="address" name="address" required placeholder="المنطقة / المحافظة">
            </div>

            <!-- رقم الطبلة -->
            <div class="form-group">
                <label for="fileNumber">رقم الطبلة:</label>
                <input type="text" id="fileNumber" name="fileNumber" required placeholder="رقم الملف الطبي">
            </div>

            <!-- رقم الهاتف -->
            <div class="form-group">
                <label for="phone">رقم الهاتف:</label>
                <input type="tel" id="phone" name="phone" placeholder="07xxxxxxxx">
            </div>

            <!-- الأخصائي -->
            <div class="form-group">
                <label for="specialist">الأخصائي المشرف:</label>
                <input type="text" id="specialist" name="specialist" required placeholder="اسم الطبيب الأخصائي">
            </div>

            <!-- تاريخ الدخول -->
            <div class="form-group">
                <label for="admissionDate">تاريخ الدخول:</label>
                <input type="date" id="admissionDate" name="admissionDate" required>
            </div>

            <!-- التشخيص -->
            <div class="form-group full-width">
                <label for="diagnosis">التشخيص:</label>
                <textarea id="diagnosis" name="diagnosis" rows="3" required placeholder="التشخيص السريري المبدئي..."></textarea>
            </div>
        </div>

        <button type="submit" id="submitBtn">حفظ وإرسال البيانات</button>
        <div id="responseMessage" class="alert"></div>
    </form>
</div>

<script>
    // ⚠️ ضع رابط الـ Web App الخاص بـ Google Apps Script هنا بعد إنشائه
    const SCRIPT_URL = 'YOUR_GOOGLE_APPS_SCRIPT_URL_HERE';

    // تعيين تاريخ اليوم تلقائياً لحقل تاريخ الدخول
    document.getElementById('admissionDate').valueAsDate = new Date();

    const form = document.getElementById('patientForm');
    const submitBtn = document.getElementById('submitBtn');
    const responseMessage = document.getElementById('responseMessage');

    form.addEventListener('submit', function(e) {
        e.preventDefault();
        
        submitBtn.disabled = true;
        submitBtn.textContent = 'جاري الحفظ...';
        responseMessage.className = 'alert';
        responseMessage.style.display = 'none';

        const formData = new FormData(form);
        const data = {};
        formData.forEach((value, key) => (data[key] = value));

        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors', // ضروري لطلبات Google Apps Script من النطاقات الخارجية
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(data)
        })
        .then(() => {
            responseMessage.textContent = 'تم حفظ بيانات المريض بنجاح في النظام!';
            responseMessage.className = 'alert success';
            form.reset();
            document.getElementById('admissionDate').valueAsDate = new Date(); // إعادة ضبط التاريخ
        })
        .catch(error => {
            console.error('Error!', error);
            responseMessage.textContent = 'حدث خطأ أثناء الحفظ، يرجى المحاولة مرة أخرى.';
            responseMessage.className = 'alert error';
        })
        .finally(() => {
            submitBtn.disabled = false;
            submitBtn.textContent = 'حفظ وإرسال البيانات';
        });
    });
</script>

</body>
</html>
