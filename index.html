<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>استمارة المريض الراقد</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }
        body { background-color: #eef2f6; color: #1e293b; padding: 10px; display: flex; justify-content: center; }
        .mobile-card { background: #ffffff; width: 100%; max-width: 480px; border-radius: 18px; padding: 20px 14px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08); border: 1px solid #cbd5e1; }
        .header { text-align: center; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid #1e40af; }
        .header h2 { color: #1e40af; font-size: 1.4rem; font-weight: 900; }
        
        .alert { display: none; padding: 12px; border-radius: 10px; font-size: 0.95rem; font-weight: 800; text-align: center; margin-bottom: 15px; }
        .alert.success { background-color: #dcfce7; color: #14532d; border: 2px solid #22c55e; }
        .alert.error { background-color: #fee2e2; color: #7f1d1d; border: 2px solid #ef4444; }

        .field-box { position: relative; margin-top: 14px; margin-bottom: 12px; }
        .field-box label { position: absolute; top: -11px; right: 12px; background-color: #1e40af; color: #ffffff !important; font-size: 0.82rem; font-weight: 800; padding: 1px 10px; border-radius: 6px; z-index: 10; }
        .field-box input, .field-box select, .field-box textarea { width: 100%; padding: 14px 12px 10px 12px; border: 2px solid #94a3b8; border-radius: 12px; font-size: 1rem; font-weight: 700; color: #0f172a; outline: none; background: #fff; }
        .field-box textarea { resize: vertical; height: 85px; }
        
        .row-grid { display: flex; gap: 10px; }
        .row-grid .field-box { flex: 1; }

        .camera-btn-box { background-color: #eff6ff; border: 2px dashed #1e40af; border-radius: 14px; padding: 15px; text-align: center; cursor: pointer; margin-top: 15px; }
        .preview-box { display: none; margin-top: 10px; position: relative; border-radius: 12px; overflow: hidden; border: 2px solid #1e40af; }
        .preview-box img { width: 100%; max-height: 220px; object-fit: cover; display: block; }
        .btn-cancel { position: absolute; top: 8px; left: 8px; background-color: #dc2626; color: white; border: none; padding: 6px 12px; border-radius: 8px; font-weight: bold; cursor: pointer; }

        .btn-submit { width: 100%; background-color: #1e40af; color: #ffffff; border: none; padding: 14px; font-size: 1.1rem; font-weight: 900; border-radius: 12px; margin-top: 15px; cursor: pointer; }
        .btn-submit:disabled { background-color: #94a3b8; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="mobile-card">
    <div class="header">
        <h2>استمارة المريض الراقد</h2>
    </div>

    <!-- تنبيهات الرسائل -->
    <div id="alertBox" class="alert"></div>

    <form id="patientForm">
        <div class="field-box">
            <label for="full_name">الاسم الثلاثي *</label>
            <input type="text" id="full_name" name="full_name" required placeholder="أدخل اسم المريض الكامل">
        </div>

        <div class="row-grid">
            <div class="field-box">
                <label for="mother_name">اسم الأم *</label>
                <input type="text" id="mother_name" name="mother_name" required placeholder="اسم الأم الثلاثي">
            </div>
            <div class="field-box">
                <label for="age">العمر *</label>
                <input type="number" id="age" name="age" required placeholder="بالسنوات">
            </div>
        </div>

        <div class="row-grid">
            <div class="field-box">
                <label for="gender">الجنس *</label>
                <select id="gender" name="gender" required>
                    <option value="" disabled selected>اختر الجنس</option>
                    <option value="ذكر">ذكر</option>
                    <option value="أنثى">أنثى</option>
                </select>
            </div>
            <div class="field-box">
                <label for="phone_number">رقم الهاتف *</label>
